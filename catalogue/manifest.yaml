apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  # modify replicas according to your case
  replicas: 1
  # replicaset uses these labels to match pods
  selector:
    matchLabels:
       project: roboshop
       tier: backend
       component: catalogue
    
  # pod definition
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catalogue
        
    spec:
      containers:
      - name: catalogue
        image: joindevops/catalogue:4.0.0
        envFrom:
         - configMapRef:
            name: catalogue
---        
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  # selector uses below labels to select the pod
  selector:
    project: roboshop
    tier: backend
    component: catalogue
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080